<div class="student-dashboard-layout">
  <!-- ── 1. BARRA LATERAL IZQUIERDA (NAVEGACIÓN - NODO HIJO PRESENTACIONAL) ── -->
  <app-estudiante-sidebar
    [navItems]="navItems()"
    [(activeNav)]="activeNav"
    [institution]="studentInstitution()"
    (navSelected)="selectNav($event)"
    (logoutClicked)="onLogout()"
  />

  <!-- ── 2. ÁREA CENTRAL DE CONTENIDO (DASHBOARD) ── -->
  <main class="main-content">
    <!-- Header Superior con Buscador y Notificaciones (NODO HIJO PRESENTACIONAL) -->
    <app-estudiante-header
      [(searchQuery)]="searchQuery"
      [studentName]="studentName()"
      [userInitials]="userInitials()"
      [notificationsCount]="notificationsCount()"
      [isAiDrawerOpen]="isAiDrawerOpen()"
      (searchChanged)="onSearchChange($event)"
      (notificationsClicked)="onNotificationsClick()"
      (profileClicked)="selectNav('perfil')"
      (configClicked)="selectNav('configuracion')"
      (aiToggleClicked)="toggleAiDrawer()"
    />

    @if (activeNav() === 'biblioteca') {
      <app-biblioteca [userRole]="'student'" [initialCategory]="selectedSubjectCategory()" />
    } @else if (activeNav() === 'configuracion' || activeNav() === 'perfil') {
      <app-configuracion
        [user]="currentUser()"
        [isEmbedded]="true"
        (logoutRequested)="onLogout()"
      />
    } @else {
      <!-- Saludo y Bienvenida -->
      <section class="welcome-section" aria-label="Bienvenida al estudiante">
        <h1 class="welcome-title">¡Hola, {{ studentName() }}!</h1>
        <p class="welcome-subtitle">
          Tienes un <strong>85% de progreso</strong> en Biología esta semana. ¡Sigue así!
        </p>
      </section>

      <!-- Tarjeta Destacada: Continuar Aprendiendo (NODO HIJO PRESENTACIONAL) -->
      <app-estudiante-continue-course
        [course]="currentCourse()"
        (continueClicked)="onContinueCourse()"
      />

      <!-- Sección Intermedia: Biblioteca Digital + Examen y Progreso Semanal (NODOS HIJOS) -->
      <div class="middle-grid">
        <!-- Columna Izquierda: Cuadrícula de Biblioteca Digital -->
        <app-estudiante-subjects-grid
          [subjects]="filteredSubjects()"
          (subjectSelected)="onSelectSubject($event)"
          (viewAllRequested)="onViewAllLibrary()"
        />

        <!-- Columna Derecha: Examen de Práctica + Progreso Semanal -->
        <app-estudiante-exam-card
          [practiceExam]="practiceExam()"
          [weeklyProgress]="weeklyProgress()"
          (startExamClicked)="onStartExam()"
        />
      </div>

      <!-- Sección Inferior: Preguntas Recientes en Foros (NODO HIJO PRESENTACIONAL) -->
      <app-estudiante-forum-preview
        [questions]="forumQuestions()"
        [brokenAvatars]="avatarErrors()"
        (viewAllRequested)="onViewAllForums()"
        (viewThreadRequested)="onViewThread($event)"
        (avatarErrorOccurred)="onAvatarError($event)"
      />
    }
  </main>

  <!-- ── 3. PANEL LATERAL DERECHO DESPLEGABLE (DRAWER ASISTENTE IA - NODO HIJO) ── -->
  <app-estudiante-ai-drawer
    [isOpen]="isAiDrawerOpen()"
    [chatMessages]="chatMessages()"
    [quickActions]="quickActions()"
    [isAiThinking]="isAiThinking()"
    [(inputText)]="aiInputText"
    (closeRequested)="closeAiDrawer()"
    (messageSubmitted)="onSendAiMessage($event)"
    (quickActionTriggered)="onQuickAction($event)"
  />

  <!-- Toast flotante para feedback de acciones -->
  @if (toastMessage()) {
    <div class="student-toast anim-fade-in" role="status" aria-live="polite">
      <i class="bi bi-info-circle-fill"></i>
      <span>{{ toastMessage() }}</span>
    </div>
  }
</div>
