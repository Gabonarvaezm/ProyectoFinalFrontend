<div class="side-cards-col">
  <!-- Tarjeta: Examen de Práctica -->
  <div class="practice-exam-card">
    <h3 class="exam-title">{{ practiceExam().title }}</h3>
    <h4 class="exam-subtitle">{{ practiceExam().topic }}</h4>

    <div class="exam-meta-row">
      <span class="exam-meta-item">
        <i class="bi bi-list-task"></i>
        <span>{{ practiceExam().questionsCount }} Preguntas</span>
      </span>
      <span class="exam-meta-item">
        <i class="bi bi-speedometer2"></i>
        <span>Dificultad: {{ practiceExam().difficulty }}</span>
      </span>
    </div>

    <button type="button" class="btn-start-exam" (click)="startExamClicked.emit()">
      Iniciar Examen
    </button>
  </div>

  <!-- Tarjeta: Progreso Semanal -->
  <div class="weekly-progress-card">
    <h3 class="progress-card-title">Progreso Semanal</h3>
    <div class="chart-mockup">
      <div class="chart-y-axis">
        <span>100%</span>
        <span>50%</span>
        <span>0%</span>
      </div>
      <div class="chart-bars-wrap">
        @for (item of weeklyProgress(); track item.subject) {
          <div class="bar-col">
            <div class="bar-track">
              <div class="bar-fill" [style.height.%]="item.percentage"></div>
            </div>
            <span class="bar-label">{{ item.subject }}</span>
          </div>
        }
      </div>
    </div>
  </div>
</div>
