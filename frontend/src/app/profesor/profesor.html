<div class="dashboard-layout">
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- 1. BARRA LATERAL IZQUIERDA (NODO HIJO PRESENTACIONAL)                   -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <app-profesor-sidebar [navItems]="navItems()" [(activeNav)]="activeNav" (navSelected)="selectNav($event)"
    (newAnalysis)="onNewAnalysis()" />

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- 2. CONTENIDO PRINCIPAL (HEADER + KPIS + TABLA + ACTIVIDAD)            -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <div class="main-wrapper">
    <!-- Barra superior de búsqueda y perfil (NODO HIJO PRESENTACIONAL) -->
    <app-profesor-header [(searchQuery)]="searchQuery" [notificationsCount]="1"
      (notificationsClicked)="onNotificationsClick()" />

    <!-- Contenido Scrollable / Dashboard Canvas -->
    <main class="dashboard-canvas">
      @if (activeNav() === 'biblioteca') {
      <app-biblioteca [userRole]="'professor'" (bookRecommended)="onBookRecommended($event)"></app-biblioteca>
      } @else {
      <!-- Banner de Bienvenida -->
      <section class="welcome-card" aria-label="Bienvenida al docente">
        <h1 class="welcome-title">¡Hola, Prof. García!</h1>
        <p class="welcome-subtitle">
          Tus alumnos han avanzado un <strong class="stat-highlight">12%</strong> más esta semana.
        </p>
      </section>

      <!-- Tarjetas de Métricas (NODO HIJO PRESENTACIONAL) -->
      <app-profesor-kpi-cards [kpiMetrics]="kpiMetrics()" />

      <!-- Cuadrícula de Contenido: Student Progress + Actividad & Acciones -->
      <div class="content-split-grid">
        <!-- Columna Izquierda: Student Progress Table (NODO HIJO PRESENTACIONAL) -->
        <app-profesor-student-table [students]="filteredStudents()" [totalCount]="filteredStudents().length"
          (deleteStudent)="onDeleteStudent($event)" (registerStudentClick)="openRegisterModal()" />

        <!-- Columna Derecha: Recent Activity + Quick Actions (NODO HIJO PRESENTACIONAL) -->
        <app-profesor-activity-feed [activities]="recentActivities()" [quickActions]="quickActions()"
          (quickActionTriggered)="triggerQuickAction($event)" />
      </div>
      }
    </main>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- 3. PANEL LATERAL DERECHO (ASISTENTE IA - NODO HIJO PRESENTACIONAL)      -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <app-profesor-ai-chat [chatMessages]="chatMessages()" [aiSuggestions]="aiSuggestions()"
    [isAiThinking]="isAiThinking()" [(inputText)]="aiInputText" (suggestionSelected)="selectSuggestion($event)"
    (messageSubmitted)="onSendAiMessage($event)" />

  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <!-- 4. MODAL DE REGISTRO DE ESTUDIANTE (NODO HIJO PRESENTACIONAL)          -->
  <!-- ═══════════════════════════════════════════════════════════════════════ -->
  <app-profesor-create-student-modal [isOpen]="isRegisterModalOpen()" [isSubmitting]="isSubmittingStudent()"
    (closeModal)="closeRegisterModal()" (studentSubmitted)="onRegisterStudentSubmit($event)" />

  <!-- Toast Notification para Interacciones Rápidas -->
  @if (actionNotification()) {
  <div class="toast-feedback" role="status" aria-live="polite">
    <i class="bi bi-info-circle-fill" aria-hidden="true"></i>
    <span>{{ actionNotification() }}</span>
  </div>
  }
</div>
